{% extends "base.html" %}

{% block title %}

WHOIS Lookup

{% endblock %}

{% block content %}

<div class="tool-container">

    <div class="tool-header">

        <h1>WHOIS Lookup</h1>

        <p>

            Retrieve domain registration information and registrar details.

        </p>

    </div>

    <div class="tool-info">

        <h3>Capabilities</h3>

        <ul>

            <li>Registrar Information</li>

            <li>Creation Date</li>

            <li>Expiry Date</li>

            <li>Name Servers</li>

        </ul>

    </div>

    <form class="tool-form" action="/whois" method="POST">

        <label>Domain Name</label>

        <input
            class="tool-input"
            type="text"
            name="domain"
            placeholder="google.com"
            required>

        <button class="primary-btn">

            Lookup Domain

        </button>

    </form>

    <div class="tool-actions">

        <a href="/" class="secondary-btn">

            ← Back to Dashboard

        </a>

    </div>

</div>

{% endblock %}
