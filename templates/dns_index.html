{% extends "base.html" %}

{% block title %}

DNS Enumeration

{% endblock %}

{% block content %}

<div class="tool-container">

    <div class="tool-header">

        <h1>DNS Enumeration</h1>

        <p>

            Enumerate DNS records including A, AAAA, MX, NS, TXT and SOA.

        </p>

    </div>

    <div class="tool-info">

        <h3>Capabilities</h3>

        <ul>

            <li>A & AAAA Records</li>

            <li>MX Records</li>

            <li>TXT Records</li>

            <li>SOA & NS Records</li>

        </ul>

    </div>

    <form class="tool-form" action="/dns" method="POST">

        <label>Domain Name</label>

        <input
            class="tool-input"
            type="text"
            name="domain"
            placeholder="google.com"
            required>

        <button class="primary-btn">

            Enumerate DNS

        </button>

    </form>

    <div class="tool-actions">

        <a href="/" class="secondary-btn">

            ← Back to Dashboard

        </a>

    </div>

</div>

{% endblock %}
